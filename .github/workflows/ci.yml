name: Frontend CI and Cloudflare Deployment

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  frontend-tests:
    name: Frontend tests and build verification
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: frontend-tests-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Syntax-check frontend JavaScript
        run: |
          set -euo pipefail
          find . -path ./.git -prune -o -name '*.js' -print0 | while IFS= read -r -d '' file; do
            node --check "$file"
          done

      - name: Run Node unit, orchestration and Worker tests
        run: >-
          node --test
          tests/api-client.test.js
          tests/date-format.test.js
          tests/theme-colors.test.js
          tests/reports-orchestration.test.js
          tests/worker-proxy.test.js
          tests/transactions-client.test.js
          tests/analytics-period.test.js

      - name: Run browser regression tests
        env:
          CHROME_BIN: /usr/bin/google-chrome
        run: >-
          node --test
          tests/theme-browser.test.js
          tests/reports-browser.test.js
          tests/categories-browser.test.js
          tests/account-settings-browser.test.js
          tests/transactions-browser.test.js
          tests/reports-period-browser.test.js
          tests/responsive-layout.test.js

      - name: Run legacy site verification
        run: node tools/legacy-site-verify.js

      - name: Verify production build preparation
        run: >-
          node deploy/prepare-frontend-deploy.js
          --api-base-url https://spendsensehq.pages.dev
          --destination "${{ runner.temp }}/spendsense-build-check"
          --force

  deploy-frontend:
    name: Deploy Frontend to Cloudflare Pages
    needs: frontend-tests
    # Production deploys are main-only. Manual runs on other branches still
    # execute the test job but are not allowed to publish.
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Configure required reviewers on this environment to add an explicit
    # approval gate for every production deployment.
    environment:
      name: production
      url: https://spendsensehq.pages.dev
    concurrency:
      group: frontend-production-deploy
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Verify deployment secrets
        env:
          API_BASE_URL: ${{ secrets.API_BASE_URL }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          missing=()
          for var in API_BASE_URL CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID; do
            if [ -z "${!var}" ]; then missing+=("$var"); fi
          done
          if [ ${#missing[@]} -gt 0 ]; then echo "Missing secrets: ${missing[*]}"; exit 1; fi

      - name: Prepare frontend deploy
        run: >-
          node deploy/prepare-frontend-deploy.js
          --api-base-url "${{ secrets.API_BASE_URL }}"
          --destination "${{ runner.temp }}/spendsense-dist"
          --force

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy ${{ runner.temp }}/spendsense-dist --project-name=spendsensehq --branch=main
