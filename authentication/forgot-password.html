<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="referrer" content="strict-origin-when-cross-origin" />
    <meta name="api-base-url" content="http://127.0.0.1:8002" />
    <title>Reset password | SpendSense</title>
    <script src="../theme.js"></script>
    <link rel="stylesheet" href="../styles.css" />
    <link rel="stylesheet" href="auth.css" />
  </head>
  <body class="app-body auth-page">
    <div class="auth-backdrop" aria-hidden="true"></div>
    <main class="auth-card">
      <div class="auth-head">
        <span class="brand-mark">S</span>
        <h1>Reset your password</h1>
        <p id="forgot-instruction">Enter your account email to receive reset instructions, then choose a new password.</p>
      </div>

      <form
        class="auth-form"
        data-forgot-form
        novalidate
      >
        <div class="field">
          <label for="email">Account email</label>
          <input id="email" name="email" type="email" placeholder="you@example.com" autocomplete="email" required />
        </div>
        <button class="btn primary block" type="submit" data-forgot-submit>Send reset instructions</button>
        <p class="auth-message" data-forgot-message aria-live="polite"></p>
        <div style="margin-top: 10px; text-align: center;">
          <button type="button" class="link small" data-show-reset-step style="background: none; border: 0; cursor: pointer; color: var(--teal); font-weight: 500;">Already have a reset token? Enter it here</button>
        </div>
      </form>

      <form
        class="auth-form"
        data-reset-form
        hidden
        novalidate
        style="margin-top: 14px;"
      >
        <div class="field">
          <label for="reset-email">Account email</label>
          <input id="reset-email" name="email" type="email" placeholder="you@example.com" autocomplete="email" required />
        </div>
        <div class="field">
          <label for="reset-token">Reset token</label>
          <input id="reset-token" name="token" type="text" placeholder="Enter the reset token" required autocomplete="off" />
        </div>
        <div class="field">
          <label for="reset-password">New password</label>
          <div class="password-field">
            <input id="reset-password" name="password" type="password" required minlength="8" autocomplete="new-password" placeholder="At least 8 characters" />
            <button type="button" data-toggle-password aria-label="Show password">Show</button>
          </div>
          <p class="field-hint">Must be at least 8 characters.</p>
        </div>
        <div class="field">
          <label for="reset-password-confirmation">Confirm new password</label>
          <div class="password-field">
            <input id="reset-password-confirmation" name="password_confirmation" type="password" required minlength="8" autocomplete="new-password" placeholder="Confirm new password" />
            <button type="button" data-toggle-password aria-label="Show password">Show</button>
          </div>
        </div>
        <button class="btn primary block" type="submit" data-reset-submit>Reset password</button>
        <p class="auth-message" data-reset-message aria-live="polite"></p>
        <div style="margin-top: 10px; text-align: center;">
          <button type="button" class="link small" data-show-forgot-step style="background: none; border: 0; cursor: pointer; color: var(--muted);">← Request a new token</button>
        </div>
      </form>

      <p class="auth-switch">
        Remembered it? <a href="login.html">Back to log in</a>
      </p>
      <p class="auth-switch secondary-switch">
        <a href="../index.html">← Back to home</a>
      </p>
    </main>

    <script src="../script.js"></script>
    <script src="auth.js"></script>
  </body>
</html>
