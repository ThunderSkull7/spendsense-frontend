<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="api-base-url" content="http://127.0.0.1:8002" />
    <title>Reset password | SpendSense</title>
    <script src="../theme.js"></script>
    <link rel="stylesheet" href="../styles.css" />
    <link rel="stylesheet" href="auth.css" />
  </head>
  <body class="app-body auth-page">
    <main class="auth-card">
      <div class="auth-head">
        <span class="brand-mark">S</span>
        <h1>Reset your password</h1>
        <p>Password reset isn't supported yet — we can't send reset emails. Contact support if you need help getting back in.</p>
      </div>

      <form
        class="auth-form"
        data-auth-form
        novalidate
      >
        <div class="field">
          <label for="email">Email</label>
          <input id="email" name="email" type="email" placeholder="you@example.com" autocomplete="email" required />
        </div>
        <button class="btn primary block" type="submit">Send reset instructions</button>
        <p class="auth-message" data-auth-message aria-live="polite"></p>
      </form>

      <p class="auth-switch">
        Remembered it? <a href="login.html">Back to log in</a>
      </p>
      <p class="auth-switch secondary-switch">
        <a href="../index.html">← Back to home</a>
      </p>
    </main>

    <script src="../script.js"></script>
    <script src="auth.js"></script>
  </body>
</html>
