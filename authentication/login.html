<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="api-base-url" content="http://127.0.0.1:8002" />
    <title>Log in | SpendSense</title>
    <script src="../theme.js"></script>
    <link rel="stylesheet" href="../styles.css" />
    <link rel="stylesheet" href="auth.css" />
  </head>
  <body class="app-body auth-page">
    <main class="auth-card">
      <div class="auth-head">
        <span class="brand-mark">S</span>
        <h1>Welcome back</h1>
        <p>Log in to pick up where you left off.</p>
      </div>

      <form class="auth-form" data-auth-form novalidate>
        <div class="field">
          <label for="email">Email</label>
          <input id="email" name="email" type="email" placeholder="you@example.com" autocomplete="email" required />
        </div>
        <div class="field">
          <label for="password">Password</label>
          <div class="password-field">
            <input id="password" name="password" type="password" placeholder="Your password" autocomplete="current-password" required />
            <button type="button" data-toggle-password aria-label="Show password">Show</button>
          </div>
        </div>
        <button class="btn primary block" type="submit">Log in</button>
        <p class="auth-message" data-auth-message aria-live="polite"></p>
      </form>

      <p class="auth-switch">
        New to SpendSense? <a href="signup.html">Create an account</a>
      </p>
      <p class="auth-switch secondary-switch">
        <a href="forgot-password.html">Forgot your password?</a>
      </p>
      <p class="auth-switch secondary-switch">
        <a href="../index.html">← Back to home</a>
      </p>
    </main>

    <script src="../script.js"></script>
    <script src="auth.js"></script>
  </body>
</html>
